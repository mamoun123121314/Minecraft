name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run physics
      - run: npm run mining
      - run: npm run inventory
      - run: npm run lighting
      - run: npm run crafting
      - run: npm run survival
      - run: npm run combat
      - run: npm run containers
      - run: npm run food
      - name: Brewing and effects
        run: npm run brewing
      - name: Potion parity
        run: npm run potion-parity
      - name: Enchanting progression
        run: npm run enchanting
      - run: npm run save
      - run: npm run world
      - run: npm run gravity
      - run: npm run redstone
      - run: npm run fluids
      - run: npm run farming
      - run: npm run mesher
      - run: npm run block-actions
      - run: npm run block-states
      - run: npm run block-families
      - run: npm run shape-targets
      - run: npm run blocks
      - run: npm run items
      - run: npm run recipes
      - run: npm run fidelity-java
      - name: Run browser smoke test
        shell: bash
        run: |
          set +e
          output=$(npm run smoke 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=$(printf '%s' "$output" | tail -20 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Browser smoke test failed::$message"
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cubeworld-${{ github.run_id }}-screenshots
          path: artifacts/
